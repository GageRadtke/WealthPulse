spring.application.name=backend

# ── Runtime Profile ──────────────────────────────────────────────
# Run with the local development profile unless another profile is explicitly selected.
# Production deployments should set SPRING_PROFILES_ACTIVE=prod and provide JWT_SECRET.
spring.profiles.default=dev

# ── Database ─────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wealthpulse}
# Defaults make a freshly initialized local PostgreSQL installation work when
# starting with `./mvnw spring-boot:run`. Deployment environments override
# these through DB_USERNAME and DB_PASSWORD.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── External Market Providers ────────────────────────────────────
# API keys are optional locally: price lookups then fall back to cached or
# manually entered values. Set these environment variables to enable live data.
goldapi.key=${GOLD_API_KEY:}
alphavantage.key=${ALPHA_VANTAGE_KEY:}

# ── Web and Persistence Limits ───────────────────────────────────
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.jpa.open-in-view=false

# ── JWT Configuration ─────────────────────────────────────────────
# Production must provide JWT_SECRET. The development profile supplies a local-only
# fallback so `./mvnw spring-boot:run` works for the capstone project.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ── CORS Configuration ────────────────────────────────────────────
# Single source of truth — change here for both dev and production
# Default allowed origins for local development. Can be overridden by the
# CORS_ALLOWED_ORIGINS environment variable (comma-separated list).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
# Backend default port for local development. Override with SERVER_PORT when
# another local process is already using 8283.
server.port=${SERVER_PORT:8283}
